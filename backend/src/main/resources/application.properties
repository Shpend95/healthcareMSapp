server.port=8081
spring.application.name=mount-hospital

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mount_hospital?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=mountHospitalSecretKeyForJWTTokenGeneration2024MustBeAtLeast32CharactersLong
jwt.expiration=86400000
