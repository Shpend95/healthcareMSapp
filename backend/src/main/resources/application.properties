# Server Configuration
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mount_hospital?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=hospital_user
spring.datasource.password=hospital123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security
# NOTE: example base64-encoded secret for demo purposes only. Replace for production.
security.jwt.secret=TXlTdXBlclNlY3JldEtleUZvck1vdW50SG9zcGl0YWwhMTIz
security.jwt.expiration-ms=3600000

# CORS Configuration (will be handled in Java config)
spring.web.cors.allowed-origins="*"

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# Logging
logging.level.com.mounthospital=DEBUG
logging.level.org.springframework.web=INFO
